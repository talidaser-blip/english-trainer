<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личный кабинет | English Trainer</title>
  <style>
    :root {
      --bg: #0b1e28;
      --card-bg: #133340;
      --card-inner: #0e2733;
      --border: #1e4557;
      --accent: #f97316;
      --teal: #14b8a6;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --success: #2dd4bf;
      --danger: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 960px; display: flex; flex-direction: column; gap: 20px; }
    
    .panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
    .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    h2 { font-size: 20px; color: var(--accent); }
    
    /* Профиль */
    .profile-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
    .input-box { display: flex; flex-direction: column; gap: 6px; }
    .input-box label { font-size: 13px; color: var(--text-muted); }
    .input-box input { background: var(--card-inner); border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 8px; font-size: 15px; outline: none; }
    .input-box input:focus { border-color: var(--teal); }

    /* Бейджи уровня */
    .badge-bar { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
    .badge { background: #1a4254; padding: 6px 14px; border-radius: 20px; font-size: 14px; font-weight: 600; color: var(--success); border: 1px solid var(--teal); }

    /* Календарь активности */
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-top: 12px; }
    .cal-day-head { text-align: center; font-size: 12px; color: var(--text-muted); font-weight: bold; }
    .cal-cell { background: var(--card-inner); border: 1px solid var(--border); border-radius: 8px; min-height: 52px; padding: 6px; display: flex; flex-direction: column; justify-content: space-between; font-size: 13px; transition: 0.2s; }
    .cal-cell.empty { background: transparent; border: none; }
    .cal-cell.active { background: #114b53; border-color: var(--success); color: #fff; font-weight: bold; box-shadow: 0 0 10px rgba(45, 212, 191, 0.2); }
    .cal-cell .dot { width: 8px; height: 8px; background: var(--success); border-radius: 50%; align-self: flex-end; }

    /* Сетка 50 уроков */
    .lessons-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; max-height: 480px; overflow-y: auto; padding-right: 6px; }
    .lesson-card { background: var(--card-inner); border: 1px solid var(--border); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
    .lesson-card.done { border-color: var(--success); background: #103844; }
    .lesson-title { font-weight: bold; font-size: 14px; color: var(--accent); }
    .lesson-status { font-size: 12px; color: var(--text-muted); }
    .lesson-bal { font-size: 13px; font-weight: 600; }

    .nav-link { color: var(--teal); text-decoration: none; font-size: 14px; font-weight: bold; }
    .nav-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="container">
  <!-- Шапка -->
  <div class="panel">
    <div class="panel-header">
      <h2>👤 Личный кабинет ученика</h2>
      <a href="./index.html" class="nav-link">➔ Перейти в Тренажёр</a>
    </div>

    <!-- Уровень и Цель -->
    <div class="badge-bar">
      <div class="badge">Уровень: А0 (С нуля / Начальный)</div>
      <div class="badge">Всего уроков: 50</div>
      <div class="badge" style="color: var(--accent); border-color: var(--accent);">Осталось пройти: <span id="lessonsLeft">50</span></div>
    </div>
  </div>

  <!-- Персональная анкета -->
  <div class="panel">
    <div class="panel-header">
      <h2>Мой профиль</h2>
      <span style="font-size: 12px; color: var(--text-muted);">Сохраняется автоматически</span>
    </div>
    <div class="profile-grid">
      <div class="input-box">
        <label>Ваше имя:</label>
        <input type="text" id="profName" placeholder="Например: Анна" oninput="saveProfile()">
      </div>
      <div class="input-box">
        <label>Сколько лет:</label>
        <input type="number" id="profAge" placeholder="Например: 25" oninput="saveProfile()">
      </div>
      <div class="input-box">
        <label>Дата старта занятий:</label>
        <input type="date" id="profStartDate" onchange="saveProfile()">
      </div>
    </div>
  </div>

  <!-- Календарь тренировок -->
  <div class="panel">
    <div class="panel-header">
      <h2>Дни активности (<span id="currentMonthYear"></span>)</h2>
      <span style="font-size: 12px; color: var(--success);">● — день занятий</span>
    </div>
    <div class="cal-grid" id="calendarDays">
      <!-- Дни недели -->
      <div class="cal-day-head">Пн</div><div class="cal-day-head">Вт</div><div class="cal-day-head">Ср</div>
      <div class="cal-day-head">Чт</div><div class="cal-day-head">Пт</div><div class="cal-day-head">Сб</div><div class="cal-day-head">Вс</div>
    </div>
  </div>

  <!-- Сетка всех 50 уроков -->
  <div class="panel">
    <div class="panel-header">
      <h2>Прогресс по 50 урокам курса А0</h2>
      <span style="font-size: 13px; color: var(--text-muted);">Пройдено: <strong id="lessonsDoneCount" style="color:var(--success);">0</strong> из 50</span>
    </div>
    <div class="lessons-grid" id="lessonsContainer"></div>
  </div>
</div>

<script>
  // Адрес вашего Google Apps Script
  const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyezcOB-j23-r-vkpmSddEVS7c9DBORH9eGHaqlrxHk_99f3WmlC3GWpuCNeY8OFTH4/exec';

  let cloudLessons = {};
  const activeDatesSet = new Set();

  window.onload = async () => {
    loadProfile();
    await fetchCloudProgress();
    renderLessonsGrid();
    renderCalendar();
  };

  // 1. Профиль ученика
  function loadProfile() {
    document.getElementById('profName').value = localStorage.getItem('eng_prof_name') || '';
    document.getElementById('profAge').value = localStorage.getItem('eng_prof_age') || '';
    document.getElementById('profStartDate').value = localStorage.getItem('eng_prof_start') || '';
  }

  function saveProfile() {
    localStorage.setItem('eng_prof_name', document.getElementById('profName').value);
    localStorage.setItem('eng_prof_age', document.getElementById('profAge').value);
    localStorage.setItem('eng_prof_start', document.getElementById('profStartDate').value);
  }

  // 2. Получение данных из Google Таблицы
  async function fetchCloudProgress() {
    try {
      const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=get_english_progress&t=${Date.now()}`);
      const data = await res.json();
      if (data && data.status === 'success' && data.lessons) {
        cloudLessons = data.lessons;
      }
    } catch(e) {
      console.warn('Офлайн режим для ЛК');
    }
  }

  // 3. Отрисовка 50 уроков
  function renderLessonsGrid() {
    const container = document.getElementById('lessonsContainer');
    container.innerHTML = '';
    let doneCount = 0;

    for (let i = 1; i <= 50; i++) {
      const localRaw = localStorage.getItem(`english_trainer_l${i}_v1`);
      const localData = localRaw ? JSON.parse(localRaw) : null;
      const lesson = cloudLessons[i] || localData || { block: 1, balance: 0, updated: '' };

      const isCompleted = (lesson.block >= 6);
      if (isCompleted) doneCount++;

      // Сбор дат для календаря из таблицы
      if (lesson.updated) {
        const parts = lesson.updated.split(' ')[0].split('.');
        if (parts.length === 3) {
          activeDatesSet.add(`${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`);
        }
      }

      const card = document.createElement('div');
      card.className = `lesson-card ${isCompleted ? 'done' : ''}`;
      card.innerHTML = `
        <div class="lesson-title">Урок ${i}</div>
        <div class="lesson-status">${isCompleted ? '✓ Завершён' : `Блок ${lesson.block || 1} из 6`}</div>
        <div class="lesson-bal" style="color: ${lesson.balance >= 0 ? 'var(--success)' : 'var(--danger)'}">
          ${lesson.balance || 0} ₽
        </div>
      `;
      container.appendChild(card);
    }

    document.getElementById('lessonsDoneCount').innerText = doneCount;
    document.getElementById('lessonsLeft').innerText = Math.max(0, 50 - doneCount);
  }

  // 4. Отрисовка календаря активности
  function renderCalendar() {
    const grid = document.getElementById('calendarDays');
    const now = new Date();
    const year = now.getFullYear();
    const month = now.getMonth();

    const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
    document.getElementById('currentMonthYear').innerText = `${monthNames[month]} ${year}`;

    const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7; // с понедельника
    const totalDays = new Date(year, month + 1, 0).getDate();

    for (let e = 0; e < firstDayIndex; e++) {
      const empty = document.createElement('div');
      empty.className = 'cal-cell empty';
      grid.appendChild(empty);
    }

    for (let day = 1; day <= totalDays; day++) {
      const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      const isActive = activeDatesSet.has(dateKey);

      const cell = document.createElement('div');
      cell.className = `cal-cell ${isActive ? 'active' : ''}`;
      cell.innerHTML = `
        <span>${day}</span>
        ${isActive ? '<div class="dot" title="Были занятия"></div>' : ''}
      `;
      grid.appendChild(cell);
    }
  }
</script>

</body>
</html>
