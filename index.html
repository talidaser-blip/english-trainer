<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Master Trainer</title>
  <!-- Салют конфетти -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg: #0b1e28;
      --card-bg: #133340;
      --accent: #f97316;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e4b5f;
      --success: #2dd4bf;
      --danger: #f87171;
      --teal: #14b8a6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 20px; }
    
    .header-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 16px 22px;
      border-radius: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }
    .balance-title { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
    .balance-value { font-size: 30px; font-weight: 700; color: var(--accent); margin-top: 2px; }
    
    .header-controls {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .block-select {
      background: #0b1e28;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }
    .block-select:focus { border-color: var(--accent); }

    .status-badge { text-align: right; font-size: 11px; color: var(--text-muted); }
    .badge-subblock { font-weight: 600; color: var(--success); text-transform: uppercase; }

    .btn-reset {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      margin-top: 4px;
      transition: all 0.2s;
    }
    .btn-reset:hover { color: var(--danger); border-color: var(--danger); }

    .trainer-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 30px 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .phrase-box {
      background: #0b1e28;
      border: 1px solid var(--border);
      padding: 24px 20px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 100px;
      text-align: center;
    }

    .phrase-text {
      font-size: 24px;
      font-weight: 600;
      line-height: 1.35;
    }

    .btn-sound {
      background: rgba(20, 184, 166, 0.15);
      border: 1px solid var(--teal);
      color: var(--teal);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn-sound:hover { background: rgba(20, 184, 166, 0.25); }

    .input-group { display: flex; gap: 8px; align-items: center; }
    input[type="text"] {
      flex: 1;
      background: #0b1e28;
      border: 1px solid var(--accent);
      color: #fff;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: var(--success);
      box-shadow: 0 0 0 1px var(--success);
    }

    .btn-action {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 14px 22px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s;
    }
    .btn-action:hover { opacity: 0.9; }

    .btn-mic {
      background: #0b1e28;
      border: 1px solid var(--border);
      color: #fff;
      padding: 14px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 18px;
      transition: all 0.2s;
    }
    .btn-mic.recording {
      background: var(--danger);
      border-color: var(--danger);
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.7; }
      to { opacity: 1; }
    }

    .status-line {
      font-size: 15px;
      padding: 12px 16px;
      border-radius: 8px;
      display: none;
      font-weight: 600;
      line-height: 1.4;
    }
    .status-line.correct {
      background: rgba(45, 212, 191, 0.2) !important;
      border: 1px solid var(--success) !important;
      color: var(--success) !important;
      display: block !important;
    }
    .status-line.wrong {
      background: rgba(248, 113, 113, 0.2) !important;
      border: 1px solid var(--danger) !important;
      color: var(--danger) !important;
      display: block !important;
    }

    .rule-box {
      display: none;
      background: rgba(248, 113, 113, 0.12);
      border: 1px solid var(--danger);
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.45;
      color: #fca5a5;
    }
    .rule-title {
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
    }

      display: none;
      background: #0b1e28;
      border: 1px dashed var(--border);
      padding: 12px 16px;
