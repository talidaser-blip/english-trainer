<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>English Master Trainer</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg: #0b1e28;
      --card-bg: #133340;
      --card-border: #1d4657;
      --accent-mango: #f97316;
      --accent-mango-hover: #ea580c;
      --teal-sound: #14b8a6;
      --success-teal: #2dd4bf;
      --coral-danger: #f87171;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 650px; display: flex; flex-direction: column; gap: 16px; }

    /* Шапка баланса */
    .header-card {
      background: linear-gradient(135deg, #133340 0%, #0d2734 100%);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .score-title { font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
    .score-val { font-size: 34px; font-weight: 700; color: var(--accent-mango); }
    .score-val.minus { color: var(--coral-danger); }

    /* Панели */
    .panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    h2 { font-size: 18px; color: #fff; }

    /* Задание */
    .task-box {
      background: #0b1e28;
      border: 1px solid var(--card-border);
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      font-size: 20px;
      font-weight: 600;
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.4;
    }

    /* Поля ввода и кнопки */
    .input-row { display: flex; gap: 10px; align-items: center; }
    input {
      flex: 1;
      background: #08161f;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
    }
    input:focus { outline: 1px solid var(--accent-mango); }

    .btn-mango {
      background: var(--accent-mango);
      color: #fff;
      font-weight: 600;
      border: none;
      padding: 14px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.2s;
    }
    .btn-mango:hover { background: var(--accent-mango-hover); }

    .btn-mic {
      background: #08161f;
      border: 1px solid var(--card-border);
      color: var(--teal-sound);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-mic.listening { background: var(--coral-danger); color: #fff; animation: pulse 1s infinite; }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .audio-btns { display: flex; gap: 10px; justify-content: center; margin-bottom: 8px; }
    .btn-teal {
      background: #10424b;
      color: var(--success-teal);
      border: 1px solid var(--teal-sound);
      padding: 10px 18px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Обратная связь */
    .feedback {
      padding: 14px;
      border-radius: 8px;
      font-size: 15px;
      text-align: center;
      display: none;
      line-height: 1.4;
    }
    .feedback.correct {
      display: block;
      background: rgba(45, 212, 191, 0.15);
      color: var(--success-teal);
      border: 1px solid var(--success-teal);
    }
    .feedback.wrong {
      display: block;
      background: rgba(248, 113, 113, 0.15);
      color: var(--coral-danger);
      border: 1px solid var(--coral-danger);
    }

    .status-tag {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      background: #0b1e28;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Шапка со счетом -->
  <div class="header-card">
    <div>
      <div class="score-title">Баланс урока</div>
      <div class="score-val" id="scoreDisplay">0 ₽</div>
    </div>
    <div style="text-align: right;">
      <span class="status-tag" id="blockBadge">Загрузка...</span>
      <div style="font-size: 13px; color: var(--text-muted); margin-top: 6px;" id="stepCounter">...</div>
    </div>
  </div>

  <!-- Экран тренажера -->
  <div class="panel" id="trainerScreen">
    <div class="audio-btns" id="soundGroup" style="display: none;">
      <button class="btn-teal" type="button" onclick="speakText(currentPhrase.en, 1)">🔊 Слушать</button>
      <button class="btn-teal" type="button" onclick="speakText(currentPhrase.en, 0.5)">🐢 Медленно</button>
    </div>

    <div class="task-box" id="taskQuestion">Загрузка урока 1...</div>

    <div class="input-row">
      <input type="text" id="answerInput" placeholder="Введите перевод..." autocomplete="off">
      <button class="btn-mic" id="micBtn" type="button" onclick="toggleSpeechRecognition()" title="Голосовой ввод">🎙️</button>
      <button class="btn-mango" type="button" onclick="checkUserAnswer()">OK</button>
    </div>

    <div class="feedback" id="feedbackMsg"></div>
  </div>
</div>

<script>
  let lessonData = { block1: [] };
  let currentIndex = 0;
  let currentPhrase = null;
  let balance = 0;
  let recognition = null;
  let isListening = false;

  function updateBalance(points) {
    balance += points;
    const el = document.getElementById('scoreDisplay');
    el.innerText = `${balance} ₽`;
    if (balance < 0) el.classList.add('minus');
    else el.classList.remove('minus');
  }

  function cleanStr(text) {
    return (text || '').toLowerCase().replace(/[.,/#!$%^&*;:{}=\-_`~()?'"]/g, '').replace(/\s+/g, ' ').trim();
  }

  // Загрузка файла урока из папки lessons/
  async function loadLessonFile() {
    try {
      const res = await fetch('./lessons/lesson_1.txt');
      if (!res.ok) throw new Error('Файл не найден');
      const text = await res.text();
      parseLessonText(text);
    } catch (e) {
      document.getElementById('taskQuestion').innerText = 'Ошибка загрузки lessons/lesson_1.txt. Проверьте файл в репозитории.';
    }
  }

  function parseLessonText(rawText) {
    const lines = rawText.split('\n').map(l => l.trim());
    let currentBlock = '';
    lessonData.block1 = [];

    lines.forEach(line => {
      if (line.startsWith('# БЛОК 1')) currentBlock = 'B1';
      else if (line.startsWith('# БЛОК 2')) currentBlock = 'B2';
      else if (currentBlock === 'B1' && line.includes('|') && !line.startsWith('#')) {
        const parts = line.split('|').map(p => p.trim());
        if (parts.length >= 2) lessonData.block1.push({ ru: parts[0], en: parts[1] });
      }
    });

    if (lessonData.block1.length > 0) {
      document.getElementById('blockBadge').innerText = 'Блок 1: RU ➔ EN';
      currentIndex = 0;
      showNextTask();
    }
  }

  function showNextTask() {
    if (currentIndex >= lessonData.block1.length) {
      document.getElementById('taskQuestion').innerText = '🎉 Блок 1 пройден!';
      confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      return;
    }

    currentPhrase = lessonData.block1[currentIndex];
    document.getElementById('taskQuestion').innerText = currentPhrase.ru;
    document.getElementById('stepCounter').innerText = `Вопрос ${currentIndex + 1} из ${lessonData.block1.length}`;

    const input = document.getElementById('answerInput');
    input.value = '';
    input.focus();

    const fb = document.getElementById('feedbackMsg');
    fb.style.display = 'none';
  }

  function checkUserAnswer() {
    const input = document.getElementById('answerInput');
    const userVal = cleanStr(input.value);
    const targetVal = cleanStr(currentPhrase.en);
    const fb = document.getElementById('feedbackMsg');

    if (!userVal) return;

    if (userVal === targetVal) {
      updateBalance(+5);
      fb.className = 'feedback correct';
      fb.innerHTML = `✓ Верно! <strong>+5 ₽</strong>`;
      speakText(currentPhrase.en, 1);
      setTimeout(() => {
        currentIndex++;
        showNextTask();
      }, 1000);
    } else {
      updateBalance(-5);
      fb.className = 'feedback wrong';
      fb.innerHTML = `✕ Ошибка (<strong>-5 ₽</strong>)<br>Правильно: <strong>${currentPhrase.en}</strong>`;
      speakText(currentPhrase.en, 0.8);
    }
  }

  document.getElementById('answerInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') checkUserAnswer();
  });

  // Озвучка речи
  function speakText(text, rate = 1) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    setTimeout(() => {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = rate;
      window.speechSynthesis.speak(u);
    }, 40);
  }

  // Голосовой ввод через микрофон
  function toggleSpeechRecognition() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      alert('Голосовой ввод не поддерживается данным браузером.');
      return;
    }

    const micBtn = document.getElementById('micBtn');

    if (isListening && recognition) {
      recognition.stop();
      return;
    }

    recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = false;

    recognition.onstart = () => {
      isListening = true;
      micBtn.classList.add
