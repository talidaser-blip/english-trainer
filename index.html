<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Master Trainer</title>
  <style>
    :root {
      --bg: #0b1e28;
      --card-bg: #133340;
      --accent: #f97316;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e4b5f;
      --success: #2dd4bf;
      --danger: #f87171;
      --teal: #14b8a6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 20px; }
    
    .header-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 16px 22px;
      border-radius: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }
    .balance-title { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
    .balance-value { font-size: 30px; font-weight: 700; color: var(--accent); margin-top: 2px; }
    
    .header-controls {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .block-select {
      background: #0b1e28;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }
    .block-select:focus { border-color: var(--accent); }

    .status-badge { text-align: right; font-size: 11px; color: var(--text-muted); }
    .badge-subblock { font-weight: 600; color: var(--success); text-transform: uppercase; }

    .btn-reset {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      margin-top: 4px;
      transition: all 0.2s;
    }
    .btn-reset:hover { color: var(--danger); border-color: var(--danger); }

    .trainer-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 30px 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .phrase-box {
      background: #0b1e28;
      border: 1px solid var(--border);
      padding: 24px 20px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 100px;
      text-align: center;
    }

    .phrase-text {
      font-size: 24px;
      font-weight: 600;
      line-height: 1.35;
    }

    .btn-sound {
      background: rgba(20, 184, 166, 0.15);
      border: 1px solid var(--teal);
      color: var(--teal);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn-sound:hover { background: rgba(20, 184, 166, 0.25); }

    .input-group { display: flex; gap: 8px; align-items: center; }
    input[type="text"] {
      flex: 1;
      background: #0b1e28;
      border: 1px solid var(--accent);
      color: #fff;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: var(--success);
      box-shadow: 0 0 0 1px var(--success);
    }

    .btn-action {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 14px 22px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s;
    }
    .btn-action:hover { opacity: 0.9; }

    .btn-mic {
      background: #0b1e28;
      border: 1px solid var(--border);
      color: #fff;
      padding: 14px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 18px;
      transition: all 0.2s;
    }
    .btn-mic.recording {
      background: var(--danger);
      border-color: var(--danger);
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.7; }
      to { opacity: 1; }
    }

    /* Строка статуса: исправлена видимость */
    .status-line {
      font-size: 15px;
      padding: 12px 16px;
      border-radius: 8px;
      display: none;
      font-weight: 600;
      line-height: 1.4;
    }
    .status-line.correct {
      background: rgba(45, 212, 191, 0.2) !important;
      border: 1px solid var(--success) !important;
      color: var(--success) !important;
      display: block !important;
    }
    .status-line.wrong {
      background: rgba(248, 113, 113, 0.2) !important;
      border: 1px solid var(--danger) !important;
      color: var(--danger) !important;
      display: block !important;
    }

    .transcription-box {
      display: none;
      background: #0b1e28;
      border: 1px dashed var(--border);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      color: #cbd5e1;
      justify-content: space-between;
      align-items: center;
    }
    .transcription-box.visible { display: flex; }
    .transcription-text { font-style: italic; color: #38bdf8; }
  </style>
</head>
<body>

<div class="container">
  <div class="header-card">
    <div>
      <div class="balance-title">Баланс урока</div>
      <div class="balance-value" id="balanceDisplay">0 ₽</div>
      <button class="btn-reset" onclick="resetProgress()" title="Сбросить шаг и начать сначала">Начать заново ↺</button>
    </div>

    <div class="header-controls">
      <select class="block-select" id="blockSelector" onchange="onBlockChange()">
        <option value="1">Блок 1: RU ➔ EN</option>
        <option value="2">Блок 2: EN ➔ RU</option>
      </select>
      <div class="status-badge">
        <div class="badge-subblock" id="subblockLabel">Загрузка...</div>
        <div id="progressCount" style="margin-top: 3px;">0 из 0</div>
      </div>
    </div>
  </div>

  <div class="trainer-card">
    <div class="phrase-box">
      <div class="phrase-text" id="sourcePhrase">Загрузка урока 1...</div>
      <button class="btn-sound" id="listenBtn" onclick="repeatCurrentAudio()" style="display: none;">🔊 Слушать</button>
    </div>

    <div class="input-group">
      <input type="text" id="userInput" placeholder="Введите перевод или продиктуйте 🎙️..." autofocus>
      <button class="btn-mic" id="micBtn" onclick="toggleMic()" title="Включить микрофон">🎙️</button>
      <button class="btn-action" id="actionBtn" onclick="handleAction()">OK</button>
    </div>

    <div class="status-line" id="statusLine"></div>

    <div class="transcription-box" id="transcriptionBox">
      <div>Произношение: <span class="transcription-text" id="transcriptionText"></span></div>
      <button class="btn-sound" onclick="repeatCurrentAudio()" style="padding: 4px 10px; font-size: 12px;">🔊 Повтор</button>
    </div>
  </div>
</div>

<script>
  const LESSON_URL = './lessons/lesson_1.txt';
  const STORAGE_KEY = 'english_trainer_progress_v2';

  let currentBlock = 2; // По умолчанию Блок 2
  let tasks = [];
  let currentIndex = 0;
  let balance = 0;
  let isWaitingNext = false;

  let recognition = null;
  let isRecording = false;

  function saveProgress() {
    const data = {
      block: currentBlock,
      index: currentIndex,
      balance: balance
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function loadProgress() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      try {
        const data = JSON.parse(raw);
        if (typeof data.block === 'number') currentBlock = data.block;
        if (typeof data.index === 'number') currentIndex = data.index;
        if (typeof data.balance === 'number') balance = data.balance;
      } catch (e) {
        console.error('Ошибка памяти:', e);
      }
    }
  }

  function resetProgress() {
    if (confirm('Сбросить текущий прогресс и начать выбранный блок сначала?')) {
      currentIndex = 0;
      isWaitingNext = false;
      saveProgress();
      renderCurrentTask();
    }
  }

  function onBlockChange() {
    const select = document.getElementById('blockSelector');
    currentBlock = parseInt(select.value, 10);
    currentIndex = 0;
    isWaitingNext = false;
    saveProgress();
    renderCurrentTask();
  }

  async function loadLesson() {
    try {
      const res = await fetch(LESSON_URL);
      if (!res.ok) throw new Error('Не удалось открыть файл урока');
      const text = await res.text();
      parseLesson(text);
      loadProgress();
      document.getElementById('blockSelector').value = currentBlock;
      if (currentIndex >= tasks.length) currentIndex = 0;
      renderCurrentTask();
    } catch (err) {
      document.getElementById('sourcePhrase').innerText = 'Ошибка загрузки файла lessons/lesson_1.txt';
      console.error(err);
    }
  }

  function parseLesson(content) {
    const lines = content.split('\n');
    let currentSubblock = 'ПОДБЛОК 1';
    tasks = [];

    for (let rawLine of lines) {
      let line = rawLine.trim();
      if (!line) continue;

      if (line.startsWith('## ПОДБЛОК')) {
        currentSubblock = line.replace('##', '').trim();
        continue;
      }

      if (line.startsWith('#')) continue;

      if (line.includes('|')) {
        const parts = line.split('|');
        if (parts.length >= 2) {
          tasks.push({
            ru: parts[0].trim(),
            en: parts[1].trim(),
            trans: parts[2] ? parts[2].trim() : '',
            subblock: currentSubblock
          });
        }
      }
    }
  }

  function renderCurrentTask() {
    if (tasks.length === 0) return;

    if (currentIndex >= tasks.length) {
      if (currentBlock === 1) {
        currentBlock = 2;
        currentIndex = 0;
        document.getElementById('blockSelector').value = 2;
        saveProgress();
        alert('Поздравляем! Блок 1 завершён. Переходим ко Блоку 2 (EN ➔ RU)!');
        renderCurrentTask();
        return;
      } else {
        document.getElementById('sourcePhrase').innerText = '🎉 Блоки успешно завершены!';
        document.getElementById('listenBtn').style.display = 'none';
        document.getElementById('userInput').style.display = 'none';
        document.getElementById('micBtn').style.display = 'none';
        document.getElementById('actionBtn').style.display = 'none';
        document.getElementById('transcriptionBox').classList.remove('visible');
        const st = document.getElementById('statusLine');
        st.className = 'status-line correct';
        st.style.display = 'block';
        st.innerText = `Великолепно! Итоговый баланс: ${balance} ₽`;
        return;
      }
    }

    const t = tasks[currentIndex];
    const sourceEl = document.getElementById('sourcePhrase');
    const listenBtn = document.getElementById('listenBtn');

    if (currentBlock === 1) {
      sourceEl.innerText = t.ru;
      listenBtn.style.display = 'none';
      document.getElementById('userInput').placeholder = 'Введите английский перевод или продиктуйте 🎙️...';
    } else {
      sourceEl.innerText = t.en;
      listenBtn.style.display = 'inline-flex';
      document.getElementById('userInput').placeholder = 'Введите русский перевод или продиктуйте 🎙️...';
      speakEnglish(t.en);
    }

    document.getElementById('subblockLabel').innerText = t.subblock;
    document.getElementById('progressCount').innerText = `${currentIndex + 1} из ${tasks.length}`;
    document.getElementById('balanceDisplay').innerText = `${balance} ₽`;

    const input = document.getElementById('userInput');
    input.value = '';
    input.disabled = false;
    input.focus();

    const statusLine = document.getElementById('statusLine');
    statusLine.style.display = 'none';
    statusLine.className = 'status-line';
    statusLine.innerText = '';

    const transBox = document.getElementById('transcriptionBox');
    transBox.classList.remove('visible');

    const btn = document.getElementById('actionBtn');
    btn.innerText = 'OK';
    isWaitingNext = false;
  }

  // Первая заглавная буква
  document.getElementById('userInput').addEventListener('input', function() {
    if (this.value.length === 1) {
      this.value = this.value.toUpperCase();
    }
  });

  // Enter
  document.getElementById('userInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      handleAction();
    }
  });

  function handleAction() {
    if (isWaitingNext) {
      currentIndex++;
      saveProgress();
      renderCurrentTask();
    } else {
      checkAnswer();
    }
  }

  // Очистка текста для гибкого сравнения (убирает дефисы, ё->е, знаки препинания)
  function cleanText(str) {
    return str
      .toLowerCase()
      .replace(/ё/g, 'е')
      .replace(/[-–—]/g, ' ')
      .replace(/[.,!?;:'"()]/g, '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function checkAnswer() {
    if (tasks.length === 0 || currentIndex >= tasks.length) return;
    if (isRecording) toggleMic();

    const input = document.getElementById('userInput');
    const userAns = input.value.trim();
    if (!userAns) return;

    const t = tasks[currentIndex];
    const statusLine = document.getElementById('statusLine');
    const btn = document.getElementById('actionBtn');
    const transBox = document.getElementById('transcriptionBox');
    const transText = document.getElementById('transcriptionText');

    input.disabled = true;

    let isCorrect = false;
    if (currentBlock === 1) {
      isCorrect = cleanText(userAns) === cleanText(t.en);
    } else {
      isCorrect = cleanText(userAns) === cleanText(t.ru);
    }

    if (isCorrect) {
      balance += 5;
      statusLine.className = 'status-line correct';
      statusLine.style.display = 'block';
      statusLine.innerText = '✓ ВЕРНО! (+5 ₽)';
    } else {
      balance -= 5;
      statusLine.className = 'status-line wrong';
      statusLine.style.display = 'block';
      const expected = currentBlock === 1 ? t.en : t.ru;
      statusLine.innerText = `✕ ОШИБКА (-5 ₽) | Правильно: ${expected}`;
    }

    document.getElementById('balanceDisplay').innerText = `${balance} ₽`;
    saveProgress();

    // Озвучиваем английскую фразу
    speakEnglish(t.en);

    if (t.trans) {
      transText.innerText = t.trans;
      transBox.classList.add('visible');
    }

    isWaitingNext = true;
    btn.innerText = 'Дальше ➔';
  }

  function speakEnglish(phrase) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const ut = new SpeechSynthesisUtterance(phrase);
    ut.lang = 'en-US';
    ut.rate = 0.9;
    window.speechSynthesis.speak(ut);
  }

  function repeatCurrentAudio() {
    if (tasks.length > 0 && currentIndex < tasks.length) {
      speakEnglish(tasks[currentIndex].en);
    }
  }

  function initSpeech() {
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRec) return;

    recognition = new SpeechRec();
    recognition.continuous = true;
    recognition.interimResults = true;

    recognition.onresult = (event) => {
      let finalTranscript = '';
      for (let i = 0; i < event.results.length; ++i) {
        finalTranscript += event.results[i][0].transcript;
      }
      finalTranscript = finalTranscript.trim();
      if (finalTranscript.length > 0) {
        const capitalized = finalTranscript.charAt(0).toUpperCase() + finalTranscript.slice(1);
        document.getElementById('userInput').value = capitalized;
      }
    };

    recognition.onerror = () => {
      isRecording = false;
      document.getElementById('micBtn').classList.remove('recording');
    };

    recognition.onend = () => {
      if (isRecording) {
        try { recognition.start(); } catch(e) {}
      } else {
        document.getElementById('micBtn').classList.remove('recording');
      }
    };
  }

  function toggleMic() {
    if (!recognition) initSpeech();
    if (!recognition) {
      alert('Голосовой ввод не поддерживается в данном браузере.');
      return;
    }

    recognition.lang = currentBlock === 1 ? 'en-US' : 'ru-RU';

    const btn = document.getElementById('micBtn');
    if (!isRecording) {
      isRecording = true;
      btn.classList.add('recording');
      try { recognition.start(); } catch(e) {}
    } else {
      isRecording = false;
      btn.classList.remove('recording');
      try { recognition.stop(); } catch(e) {}
    }
  }

  window.onload = () => {
    initSpeech();
    loadLesson();
  };
</script>
</body>
</html>
