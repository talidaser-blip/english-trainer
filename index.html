<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>English Master Trainer</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg: #0b1e28;
      --card-bg: #133340;
      --card-border: #1d4657;
      --accent-mango: #f97316;
      --accent-mango-hover: #ea580c;
      --teal-sound: #14b8a6;
      --success-teal: #2dd4bf;
      --coral-danger: #f87171;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 650px; display: flex; flex-direction: column; gap: 16px; }

    .header-card {
      background: linear-gradient(135deg, #133340 0%, #0d2734 100%);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .score-title { font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
    .score-val { font-size: 34px; font-weight: 700; color: var(--accent-mango); }
    .score-val.minus { color: var(--coral-danger); }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .task-box {
      background: #0b1e28;
      border: 1px solid var(--card-border);
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      font-size: 20px;
      font-weight: 600;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.4;
    }

    .input-row { display: flex; gap: 10px; align-items: center; }
    input {
      flex: 1;
      background: #08161f;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
    }
    input:focus { outline: 1px solid var(--accent-mango); }

    .btn-mango {
      background: var(--accent-mango);
      color: #fff;
      font-weight: 600;
      border: none;
      padding: 14px 22px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .btn-mango:hover { background: var(--accent-mango-hover); }

    .btn-mic {
      background: #08161f;
      border: 1px solid var(--card-border);
      color: var(--teal-sound);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .btn-mic.listening {
      background: var(--coral-danger);
      color: #fff;
      animation: pulse 1s infinite;
      border-color: #fca5a5;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .status-line {
      min-height: 44px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8px 14px;
      visibility: hidden;
      line-height: 1.4;
    }
    .status-line.show { visibility: visible; }
    .status-line.correct {
      background: rgba(45, 212, 191, 0.15);
      color: var(--success-teal);
      border: 1px solid var(--success-teal);
    }
    .status-line.wrong {
      background: rgba(248, 113, 113, 0.15);
      color: var(--coral-danger);
      border: 1px solid var(--coral-danger);
    }

    .status-tag {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      background: #0b1e28;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
    }

    .sub-badge {
      font-size: 11px;
      color: var(--teal-sound);
      margin-top: 4px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-card">
    <div>
      <div class="score-title">Баланс урока</div>
      <div class="score-val" id="scoreDisplay">0 ₽</div>
    </div>
    <div style="text-align: right;">
      <span class="status-tag" id="blockBadge">Блок 1: RU ➔ EN</span>
      <div class="sub-badge" id="subBadge">Подблок 1</div>
      <div style="font-size: 13px; color: var(--text-muted); margin-top: 4px;" id="stepCounter">...</div>
    </div>
  </div>

  <div class="panel">
    <div class="task-box" id="taskQuestion">Загрузка данных...</div>

    <div class="input-row">
      <input type="text" id="answerInput" placeholder="Введите перевод или продиктуйте 🎙️..." autocomplete="off">
      <button class="btn-mic" id="micBtn" type="button" onclick="toggleSpeechRecognition()" title="Голосовой ввод">🎙️</button>
      <button class="btn-mango" id="submitBtn" type="button" onclick="checkAnswer()">OK</button>
    </div>

    <div class="status-line" id="statusLine"></div>
  </div>
</div>

<script>
  let lessonTasks = [];
  let currentIndex = 0;
  let currentPhrase = null;
  let balance = 0;
  let recognition = null;
  let isListening = false;
  let isLocked = false;
  let manualStop = false;

  function updateBalance(points) {
    balance += points;
    const el = document.getElementById('scoreDisplay');
    el.innerText = `${balance} ₽`;
    if (balance < 0) el.classList.add('minus');
    else el.classList.remove('minus');
  }

  function cleanStr(text) {
    return (text || '').toLowerCase().replace(/[.,/#!$%^&*;:{}=\-_`~()?'"]/g, '').replace(/\s+/g, ' ').trim();
  }

  async function loadLessonFile() {
    const paths = [
      'lessons/lesson_1.txt',
      './lessons/lesson_1.txt',
      '/english-trainer/lessons/lesson_1.txt'
    ];

    let textData = null;
    for (const p of paths) {
      try {
        const res = await fetch(p);
        if (res.ok) {
          textData = await res.text();
          break;
        }
      } catch (err) {}
    }

    if (textData) {
      parseLessonText(textData);
    } else {
      document.getElementById('taskQuestion').innerText = 'Не удалось загрузить lessons/lesson_1.txt.';
    }
  }

  function parseLessonText(rawText) {
    const lines = rawText.split('\n').map(l => l.trim());
    let inBlock1 = false;
    let currentSub = 'Подблок 1';
    lessonTasks = [];

    for (const line of lines) {
      if (line.startsWith('# БЛОК 1')) {
        inBlock1 = true;
        continue;
      }
      if (line.startsWith('# БЛОК 2')) break;

      if (inBlock1) {
        if (line.startsWith('## ПОДБЛОК')) {
          currentSub = line.replace('##', '').trim();
          continue;
        }
        if (line.includes('|') && !line.startsWith('#')) {
          const parts = line.split('|').map(p => p.trim());
          if (parts.length >= 2) {
            lessonTasks.push({
              ru: parts[0],
              en: parts[1],
              sub: currentSub
            });
          }
        }
      }
    }

    if (lessonTasks.length > 0) {
      currentIndex = 0;
      showNextTask();
    }
  }

  function showNextTask() {
    isLocked = false;
    const input = document.getElementById('answerInput');
    const submitBtn = document.getElementById('submitBtn');
    const statusLine = document.getElementById('statusLine');

    input.disabled = false;
    submitBtn.disabled = false;
    statusLine.className = 'status-line';
    statusLine.innerHTML = '';

    if (currentIndex >= lessonTasks.length) {
      document.getElementById('taskQuestion').innerText = '🎉 Блок 1 успешно пройден!';
      document.getElementById('stepCounter').innerText = `${lessonTasks.length} из ${lessonTasks.length}`;
      confetti({ particleCount: 120, spread: 70, origin: { y: 0.6 } });
      return;
    }

    currentPhrase = lessonTasks[currentIndex];
    document.getElementById('taskQuestion').innerText = currentPhrase.ru;
    document.getElementById('subBadge').innerText = currentPhrase.sub;
    document.getElementById('stepCounter').innerText = `${currentIndex + 1} из ${lessonTasks.length}`;

    input.value = '';
    input.focus();
  }

  function checkAnswer() {
    if (isLocked) return;

    // При отправке ответа принудительно останавливаем микрофон
    stopMicrophone();

    const input = document.getElementById('answerInput');
    const submitBtn = document.getElementById('submitBtn');
    const statusLine = document.getElementById('statusLine');

    const userVal = cleanStr(input.value);
    const targetVal = cleanStr(currentPhrase.en);

    if (!userVal) return;

    isLocked = true;
    input.disabled = true;
    submitBtn.disabled = true;

    if (userVal === targetVal) {
      updateBalance(+5);
      statusLine.className = 'status-line correct show';
      statusLine.innerHTML = `✓ ВЕРНО! (+5 ₽)`;

      speakText(currentPhrase.en, 1.0);

      setTimeout(() => {
        currentIndex++;
        showNextTask();
      }, 2200);

    } else {
      updateBalance(-5);
      statusLine.className = 'status-line wrong show';
      statusLine.innerHTML = `✕ ОШИБКА (-5 ₽)  |  Правильно: ${currentPhrase.en}`;

      speakText(currentPhrase.en, 0.9);

      setTimeout(() => {
        currentIndex++;
        showNextTask();
      }, 3000);
    }
  }

  document.getElementById('answerInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') checkAnswer();
  });

  function speakText(text, rate = 1) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    setTimeout(() => {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = rate;
      window.speechSynthesis.speak(u);
    }, 40);
  }

  function stopMicrophone() {
    manualStop = true;
    if (recognition && isListening) {
      recognition.stop();
    }
    isListening = false;
    document.getElementById('micBtn').classList.remove('listening');
  }

  // Голосовой ввод с поддержкой пауз и непрерывного распознавания
  function toggleSpeechRecognition() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      alert('Голосовой ввод не поддерживается данным браузером.');
      return;
    }

    const micBtn = document.getElementById('micBtn');

    if (isListening) {
      stopMicrophone();
      return;
    }

    manualStop = false;
    recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    // Непрерывный режим: не выключаться при паузах
    recognition.continuous = true;
    // Показывать промежуточные фразы на лету
    recognition.interimResults = true;

    let finalTranscript = document.getElementById('answerInput').value;

    recognition.onstart = () => {
      isListening = true;
      micBtn.classList.add('listening');
    };

    recognition.onresult = (event) => {
      let interim = '';
      for (let i = event.resultIndex; i < event.results.length; ++i) {
        if (event.results[i].isFinal) {
          finalTranscript += (finalTranscript ? ' ' : '') + event.results[i][0].transcript.trim();
        } else {
          interim += event.results[i][0].transcript;
        }
      }
      const input = document.getElementById('answerInput');
      input.value = finalTranscript + (interim ? ' ' + interim : '');
    };

    recognition.onerror = (e) => {
      if (e.error !== 'no-speech') {
        stopMicrophone();
      }
    };

    recognition.onend = () => {
      // Если браузер пытается сам разорвать связь из-за тишины, а пользователь не нажимал стоп — перезапускаем
      if (isListening && !manualStop) {
        try {
          recognition.start();
        } catch(err) {
          stopMicrophone();
        }
      } else {
        stopMicrophone();
      }
    };

    recognition.start();
  }

  loadLessonFile();
</script>
</body>
</html>
