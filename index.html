<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Master Trainer</title>
  <style>
    :root {
      --bg: #0b1e28;
      --card-bg: #133340;
      --accent: #f97316;
      --accent-hover: #ea580c;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e4b5f;
      --success: #2dd4bf;
      --danger: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 20px; }
    
    .header-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 16px 20px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .balance-title { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
    .balance-value { font-size: 32px; font-weight: 700; color: var(--accent); margin-top: 2px; }
    .status-badge { text-align: right; font-size: 11px; color: var(--text-muted); line-height: 1.5; }
    .badge-subblock { font-weight: 600; color: var(--success); text-transform: uppercase; }

    .btn-reset {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      margin-top: 4px;
      transition: all 0.2s;
    }
    .btn-reset:hover { color: var(--danger); border-color: var(--danger); }

    .trainer-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .phrase-display {
      background: #0b1e28;
      border: 1px solid var(--border);
      padding: 24px 16px;
      border-radius: 10px;
      text-align: center;
      font-size: 22px;
      font-weight: 600;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.4;
    }

    .input-group { display: flex; gap: 8px; align-items: center; }
    input[type="text"] {
      flex: 1;
      background: #0b1e28;
      border: 1px solid var(--accent);
      color: #fff;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: var(--success);
      box-shadow: 0 0 0 1px var(--success);
    }

    button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 14px 22px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      white-space: nowrap;
    }
    button:hover { opacity: 0.9; }

    .btn-mic {
      background: #0b1e28;
      border: 1px solid var(--border);
      color: #fff;
      padding: 14px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 18px;
    }
    .btn-mic.recording {
      background: var(--danger);
      border-color: var(--danger);
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.7; }
      to { opacity: 1; }
    }

    .status-line {
      font-size: 15px;
      padding: 10px 14px;
      border-radius: 8px;
      display: none;
      font-weight: 500;
      line-height: 1.4;
    }
    .status-line.correct {
      background: rgba(45, 212, 191, 0.15);
      border: 1px solid var(--success);
      color: var(--success);
      display: block;
    }
    .status-line.wrong {
      background: rgba(248, 113, 113, 0.15);
      border: 1px solid var(--danger);
      color: var(--danger);
      display: block;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-card">
    <div>
      <div class="balance-title">Баланс урока</div>
      <div class="balance-value" id="balanceDisplay">0 ₽</div>
      <button class="btn-reset" onclick="resetProgress()" title="Сбросить сохранённый шаг и начать сначала">Начать заново ↺</button>
    </div>
    <div class="status-badge">
      <div id="blockLabel">Блок 1: RU ➔ EN</div>
      <div class="badge-subblock" id="subblockLabel">Загрузка...</div>
      <div id="progressCount" style="margin-top: 4px;">0 из 50</div>
    </div>
  </div>

  <div class="trainer-card">
    <div class="phrase-display" id="sourcePhrase">Загрузка урока 1...</div>

    <div class="input-group">
      <input type="text" id="userInput" placeholder="Введите перевод или продиктуйте 🎙️..." autofocus>
      <button class="btn-mic" id="micBtn" onclick="toggleMic()" title="Включить микрофон">🎙️</button>
      <button id="actionBtn" onclick="handleAction()">OK</button>
    </div>

    <div class="status-line" id="statusLine"></div>
  </div>
</div>

<script>
  const LESSON_URL = './lessons/lesson_1.txt';
  const STORAGE_KEY = 'english_trainer_progress_v1';

  let tasks = [];
  let currentIndex = 0;
  let balance = 0;
  let isWaitingNext = false;

  let recognition = null;
  let isRecording = false;

  // Автосохранение прогресса
  function saveProgress() {
    const data = {
      index: currentIndex,
      balance: balance
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  // Загрузка сохранённого прогресса
  function loadProgress() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      try {
        const data = JSON.parse(raw);
        if (typeof data.index === 'number') currentIndex = data.index;
        if (typeof data.balance === 'number') balance = data.balance;
      } catch (e) {
        console.error('Ошибка чтения памяти:', e);
      }
    }
  }

  // Ручной сброс прогресса
  function resetProgress() {
    if (confirm('Сбросить текущий прогресс и начать урок с 1-й фразы?')) {
      localStorage.removeItem(STORAGE_KEY);
      currentIndex = 0;
      balance = 0;
      isWaitingNext = false;
      renderCurrentTask();
    }
  }

  async function loadLesson() {
    try {
      const res = await fetch(LESSON_URL);
      if (!res.ok) throw new Error('Не удалось открыть файл урока');
      const text = await res.text();
      parseLesson(text);
      loadProgress();
      if (currentIndex >= tasks.length) currentIndex = 0;
      renderCurrentTask();
    } catch (err) {
      document.getElementById('sourcePhrase').innerText = 'Ошибка загрузки файла урока lessons/lesson_1.txt';
      console.error(err);
    }
  }

  function parseLesson(content) {
    const lines = content.split('\n');
    let currentSubblock = 'ПОДБЛОК 1';
    tasks = [];

    for (let rawLine of lines) {
      let line = rawLine.trim();
      if (!line) continue;

      if (line.startsWith('## ПОДБЛОК')) {
        currentSubblock = line.replace('##', '').trim();
        continue;
      }

      if (line.startsWith('#')) continue;

      if (line.includes('|')) {
        const parts = line.split('|');
        if (parts.length >= 2) {
          tasks.push({
            ru: parts[0].trim(),
            en: parts[1].trim(),
            subblock: currentSubblock
          });
        }
      }
    }
  }

  function renderCurrentTask() {
    if (tasks.length === 0) return;

    if (currentIndex >= tasks.length) {
      document.getElementById('sourcePhrase').innerText = '🎉 Урок 1 полностью завершён!';
      document.getElementById('userInput').style.display = 'none';
      document.getElementById('micBtn').style.display = 'none';
      document.getElementById('actionBtn').style.display = 'none';
      document.getElementById('statusLine').className = 'status-line correct';
      document.getElementById('statusLine').innerText = `Отличная работа! Итоговый результат: ${balance} ₽`;
      return;
    }

    const t = tasks[currentIndex];
    document.getElementById('sourcePhrase').innerText = t.ru;
    document.getElementById('subblockLabel').innerText = t.subblock;
    document.getElementById('progressCount').innerText = `${currentIndex + 1} из ${tasks.length}`;
    document.getElementById('balanceDisplay').innerText = `${balance} ₽`;

    const input = document.getElementById('userInput');
    input.value = '';
    input.disabled = false;
    input.focus();

    const statusLine = document.getElementById('statusLine');
    statusLine.style.display = 'none';
    statusLine.className = 'status-line';
    statusLine.innerText = '';

    const btn = document.getElementById('actionBtn');
    btn.innerText = 'OK';
    isWaitingNext = false;
  }

  // Автоматическая первая заглавная буква
  document.getElementById('userInput').addEventListener('input', function(e) {
    if (this.value.length === 1) {
      this.value = this.value.toUpperCase();
    }
  });

  // Обработка Enter
  document.getElementById('userInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      handleAction();
    }
  });

  function handleAction() {
    if (isWaitingNext) {
      currentIndex++;
      saveProgress();
      renderCurrentTask();
    } else {
      checkAnswer();
    }
  }

  function cleanText(str) {
    return str.toLowerCase().replace(/[.,!?;:'"()]/g, '').replace(/\s+/g, ' ').trim();
  }

  function checkAnswer() {
    if (tasks.length === 0 || currentIndex >= tasks.length) return;

    if (isRecording) toggleMic();

    const input = document.getElementById('userInput');
    const userAns = input.value.trim();
    if (!userAns) return;

    const currentTask = tasks[currentIndex];
    const isCorrect = cleanText(userAns) === cleanText(currentTask.en);
    const statusLine = document.getElementById('statusLine');
    const btn = document.getElementById('actionBtn');

    input.disabled = true;

    if (isCorrect) {
      balance += 5;
      statusLine.className = 'status-line correct';
      statusLine.innerText = '✓ ВЕРНО! (+5 ₽)';
    } else {
      balance -= 5;
      statusLine.className = 'status-line wrong';
      statusLine.innerText = `✕ ОШИБКА (-5 ₽) | Правильно: ${currentTask.en}`;
    }

    document.getElementById('balanceDisplay').innerText = `${balance} ₽`;
    saveProgress();
    speakEnglish(currentTask.en);

    isWaitingNext = true;
    btn.innerText = 'Дальше ➔';
  }

  function speakEnglish(phrase) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const ut = new SpeechSynthesisUtterance(phrase);
    ut.lang = 'en-US';
    ut.rate = 0.9;
    window.speechSynthesis.speak(ut);
  }

  function initSpeech() {
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRec) return;

    recognition = new SpeechRec();
    recognition.lang = 'en-US';
    recognition.continuous = true;
    recognition.interimResults = true;

    recognition.onresult = (event) => {
      let finalTranscript = '';
      for (let i = 0; i < event.results.length; ++i) {
        finalTranscript += event.results[i][0].transcript;
      }
      finalTranscript = finalTranscript.trim();
      if (finalTranscript.length > 0) {
        const capitalized = finalTranscript.charAt(0).toUpperCase() + finalTranscript.slice(1);
        document.getElementById('userInput').value = capitalized;
      }
    };

    recognition.onerror = () => {
      isRecording = false;
      document.getElementById('micBtn').classList.remove('recording');
    };

    recognition.onend = () => {
      if (isRecording) {
        try { recognition.start(); } catch(e) {}
      } else {
        document.getElementById('micBtn').classList.remove('recording');
      }
    };
  }

  function toggleMic() {
    if (!recognition) initSpeech();
    if (!recognition) {
      alert('Голосовой ввод не поддерживается в данном браузере.');
      return;
    }

    const btn = document.getElementById('micBtn');
    if (!isRecording) {
      isRecording = true;
      btn.classList.add('recording');
      try { recognition.start(); } catch(e) {}
    } else {
      isRecording = false;
      btn.classList.remove('recording');
      try { recognition.stop(); } catch(e) {}
    }
  }

  window.onload = () => {
    initSpeech();
    loadLesson();
  };
</script>
</body>
</html>
