<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>English Master Trainer</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg: #0b1e28;
      --card-bg: #133340;
      --card-border: #1d4657;
      --accent-mango: #f97316;
      --accent-mango-hover: #ea580c;
      --teal-sound: #14b8a6;
      --success-teal: #2dd4bf;
      --coral-danger: #f87171;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    
    body { 
      background-color: var(--bg); 
      color: var(--text); 
      padding: 20px; 
      min-height: 100vh;
      display: flex; 
      justify-content: center; 
      align-items: center; 
    }
    
    .container { 
      width: 100%; 
      max-width: 760px; 
      display: flex; 
      flex-direction: column; 
      gap: 20px; 
    }

    .header-card {
      background: linear-gradient(135deg, #133340 0%, #0d2734 100%);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 22px 26px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .score-title { font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
    .score-val { font-size: 38px; font-weight: 700; color: var(--accent-mango); line-height: 1.2; }
    .score-val.minus { color: var(--coral-danger); }

    .btn-reset {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      margin-top: 6px;
      transition: all 0.2s;
    }
    .btn-reset:hover { 
      color: var(--coral-danger); 
      border-color: var(--coral-danger); 
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 34px 28px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .task-box {
      background: #0b1e28;
      border: 1px solid var(--card-border);
      padding: 30px 20px;
      border-radius: 12px;
      text-align: center;
      font-size: 24px;
      font-weight: 600;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.4;
    }

    .input-row { display: flex; gap: 12px; align-items: center; }
    input {
      flex: 1;
      background: #08161f;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 16px 18px;
      border-radius: 10px;
      font-size: 18px;
      outline: none;
    }
    input:focus { 
      border-color: var(--accent-mango); 
      outline: 1px solid var(--accent-mango); 
    }

    .btn-mango {
      background: var(--accent-mango);
      color: #fff;
      font-weight: 600;
      border: none;
      padding: 16px 26px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 18px;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .btn-mango:hover { background: var(--accent-mango-hover); }

    .btn-mic {
      background: #08161f;
      border: 1px solid var(--card-border);
      color: var(--teal-sound);
      width: 54px;
      height: 54px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .btn-mic.listening {
      background: var(--coral-danger);
      color: #fff;
      animation: pulse 1s infinite;
      border-color: #fca5a5;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .status-line {
      min-height: 48px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px 16px;
      line-height: 1.4;
    }
    .status-line.show { display: flex; }
    .status-line.correct {
      background: rgba(45, 212, 191, 0.15);
      color: var(--success-teal);
      border: 1px solid var(--success-teal);
    }
    .status-line.wrong {
      background: rgba(248, 113, 113, 0.15);
      color: var(--coral-danger);
      border: 1px solid var(--coral-danger);
    }

    /* Блок русской транскрипции / произношения */
    .phonetic-box {
      display: none;
      background: #0b1e28;
      border: 1px dashed var(--teal-sound);
      border-radius: 10px;
      padding: 12px 18px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 16px;
      color: #cbd5e1;
    }
    .phonetic-box.show { display: flex; }
    .phonetic-text {
      color: #38bdf8;
      font-weight: 500;
      letter-spacing: 0.3px;
    }
    .btn-listen {
      background: #10424b;
      border: 1px solid var(--teal-sound);
      color: var(--success-teal);
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .btn-listen:hover { opacity: 0.9; }

    .status-tag {
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 20px;
      background: #0b1e28;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
    }

    .sub-badge {
      font-size: 13px;
      color: var(--teal-sound);
      margin-top: 6px;
      font-weight: 600;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-card">
    <div>
      <div class="score-title">Баланс урока</div>
      <div class="score-val" id="scoreDisplay">0 ₽</div>
      <button class="btn-reset" type="button" onclick="resetProgress()" title="Сбросить прогресс и начать урок с 1-й фразы">Начать заново ↺</button>
    </div>
    <div style="text-align: right;">
      <span class="status-tag" id="blockBadge">Блок 1: RU ➔ EN</span>
      <div class="sub-badge" id="subBadge">Подблок 1</div>
      <div style="font-size: 13px; color: var(--text-muted); margin-top: 6px;" id="stepCounter">...</div>
    </div>
  </div>

  <div class="panel">
    <div class="task-box" id="taskQuestion">Загрузка данных...</div>

    <div class="input-row">
      <input type="text" id="answerInput" placeholder="Введите перевод или продиктуйте 🎙️..." autocomplete="off">
      <button class="btn-mic" id="micBtn" type="button" onclick="toggleSpeechRecognition()" title="Голосовой ввод">🎙️</button>
      <button class="btn-mango" id="submitBtn" type="button" onclick="handleButtonClick()">OK</button>
    </div>

    <!-- 1. Плашка статуса (ВЕРНО / ОШИБКА) -->
    <div class="status-line" id="statusLine"></div>

    <!-- 2. Плашка русской транскрипции под статусом -->
    <div class="phonetic-box" id="phoneticBox">
      <div>
        <span style="color: var(--text-muted); font-size: 14px;">Произношение: </span>
        <span class="phonetic-text" id="phoneticText">[...]</span>
      </div>
      <button class="btn-listen" type="button" onclick="replayAudio()">🔊 Повторить</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'english_trainer_progress_v1';

  let lessonTasks = [];
  let currentIndex = 0;
  let currentPhrase = null;
  let balance = 0;
  let recognition = null;
  let isListening = false;
  let isLocked = false;
  let manualStop = false;
  let isWaitingNext = false;

  function saveProgress() {
    const data = {
      index: currentIndex,
      balance: balance
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function loadProgress() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      try {
        const data = JSON.parse(raw);
        if (typeof data.index === 'number') currentIndex = data.index;
        if (typeof data.balance === 'number') balance = data.balance;
      } catch (e) {
        console.error('Ошибка чтения памяти:', e);
      }
    }
  }

  function resetProgress() {
    if (confirm('Сбросить текущий прогресс и начать урок с 1-й фразы?')) {
      localStorage.removeItem(STORAGE_KEY);
      currentIndex = 0;
      balance = 0;
      isWaitingNext = false;
      updateBalance(0);
      showNextTask();
    }
  }

  function updateBalance(points) {
    balance += points;
    const el = document.getElementById('scoreDisplay');
    el.innerText = `${balance} ₽`;
    if (balance < 0) el.classList.add('minus');
    else el.classList.remove('minus');
  }

  function cleanStr(text) {
    return (text || '').toLowerCase().replace(/[.,/#!$%^&*;:{}=\-_`~()?'"]/g, '').replace(/\s+/g, ' ').trim();
  }

  function capitalizeFirst(text) {
    if (!text) return '';
    return text.charAt(0).toUpperCase() + text.slice(1);
  }

  const answerInputEl = document.getElementById('answerInput');
  answerInputEl.addEventListener('input', (e) => {
    const val = e.target.value;
    if (val.length > 0 && val.charAt(0) !== val.charAt(0).toUpperCase()) {
      const start = e.target.selectionStart;
      const end = e.target.selectionEnd;
      e.target.value = capitalizeFirst(val);
      e.target.setSelectionRange(start, end);
    }
  });

  async function loadLessonFile() {
    const paths = [
      'lessons/lesson_1.txt',
      './lessons/lesson_1.txt',
      '/english-trainer/lessons/lesson_1.txt'
    ];

    let textData = null;
    for (const p of paths) {
      try {
        const res = await fetch(p);
        if (res.ok) {
          textData = await res.text();
          break;
        }
      } catch (err) {}
    }

    if (textData) {
      parseLessonText(textData);
    } else {
      document.getElementById('taskQuestion').innerText = 'Не удалось загрузить lessons/lesson_1.txt.';
    }
  }

  function parseLessonText(rawText) {
    const lines = rawText.split('\n').map(l => l.trim());
    let inBlock1 = false;
    let currentSub = 'Подблок 1';
    lessonTasks = [];

    for (const line of lines) {
      if (line.startsWith('# БЛОК 1')) {
        inBlock1 = true;
        continue;
      }
      if (line.startsWith('# БЛОК 2')) break;

      if (inBlock1) {
        if (line.startsWith('## ПОДБЛОК')) {
          currentSub = line.replace('##', '').trim();
          continue;
        }
        if (line.includes('|') && !line.startsWith('#')) {
          const parts = line.split('|').map(p => p.trim());
          if (parts.length >= 2) {
            lessonTasks.push({
              ru: parts[0],
              en: parts[1],
              phonetic: parts[2] || '', // 3-я колонка: русская транскрипция (если есть)
              sub: currentSub
            });
          }
        }
      }
    }

    if (lessonTasks.length > 0) {
      loadProgress();
      if (currentIndex >= lessonTasks.length) currentIndex = 0;
      updateBalance(0);
      showNextTask();
    }
  }

  function showNextTask() {
    isLocked = false;
    isWaitingNext = false;

    const input = document.getElementById('answerInput');
    const submitBtn = document.getElementById('submitBtn');
    const statusLine = document.getElementById('statusLine');
    const phoneticBox = document.getElementById('phoneticBox');

    input.disabled = false;
    submitBtn.disabled = false;
    submitBtn.innerText = 'OK';

    statusLine.className = 'status-line';
    statusLine.innerHTML = '';

    phoneticBox.classList.remove('show');

    if (currentIndex >= lessonTasks.length) {
      document.getElementById('taskQuestion').innerText = '🎉 Блок 1 успешно пройден!';
      document.getElementById('stepCounter').innerText = `${lessonTasks.length} из ${lessonTasks.length}`;
      confetti({ particleCount: 120, spread: 70, origin: { y: 0.6 } });
      return;
    }

    currentPhrase = lessonTasks[currentIndex];
    document.getElementById('taskQuestion').innerText = currentPhrase.ru;
    document.getElementById('subBadge').innerText = currentPhrase.sub;
    document.getElementById('stepCounter').innerText = `${currentIndex + 1} из ${lessonTasks.length}`;

    input.value = '';
    input.focus();
  }

  function handleButtonClick() {
    if (isWaitingNext) {
      currentIndex++;
      saveProgress();
      showNextTask();
      return;
    }
    checkAnswer();
  }

  function checkAnswer() {
    if (isLocked) return;

    stopMicrophone();

    const input = document.getElementById('answerInput');
    const submitBtn = document.getElementById('submitBtn');
    const statusLine = document.getElementById('statusLine');
    const phoneticBox = document.getElementById('phoneticBox');
    const phoneticText = document.getElementById('phoneticText');

    const userVal = cleanStr(input.value);
    const targetVal = cleanStr(currentPhrase.en);

    if (!userVal) return;

    if (userVal === targetVal) {
      updateBalance(+5);
      statusLine.className = 'status-line correct show';
      statusLine.innerHTML = `✓ ВЕРНО! (+5 ₽)`;
      speakText(currentPhrase.en, 1.0);
    } else {
      updateBalance(-5);
      statusLine.className = 'status-line wrong show';
      statusLine.innerHTML = `✕ ОШИБКА (-5 ₽)  |  Правильно: ${currentPhrase.en}`;
      speakText(currentPhrase.en, 0.9);
    }

    // Если в файле урока есть транскрипция, отображаем её
    if (currentPhrase.phonetic) {
      phoneticText.innerText = `[${currentPhrase.phonetic.replace(/[\[\]]/g, '')}]`;
      phoneticBox.classList.add('show');
    } else {
      phoneticBox.classList.remove('show');
    }

    isWaitingNext = true;
    input.disabled = true;
    submitBtn.innerText = 'Дальше ➔';
    submitBtn.focus();

    saveProgress();
  }

  function replayAudio() {
    if (currentPhrase && currentPhrase.en) {
      speakText(currentPhrase.en, 0.9);
    }
  }

  document.getElementById('answerInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleButtonClick();
  });

  function speakText(text, rate = 1) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    setTimeout(() => {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = rate;
      window.speechSynthesis.speak(u);
    }, 40);
  }

  function stopMicrophone() {
    manualStop = true;
    if (recognition && isListening) {
      recognition.stop();
    }
    isListening = false;
    document.getElementById('micBtn').classList.remove('listening');
  }

  function toggleSpeechRecognition() {
    if (isWaitingNext) return;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      alert('Голосовой ввод не поддерживается данным браузером.');
      return;
    }

    const micBtn = document.getElementById('micBtn');

    if (isListening) {
      stopMicrophone();
      return;
    }

    manualStop = false;
    recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.continuous = true;
    recognition.interimResults = true;

    let finalTranscript = document.getElementById('answerInput').value;

    recognition.onstart = () => {
      isListening = true;
      micBtn.classList.add('listening');
    };

    recognition.onresult = (event) => {
      let interim = '';
      for (let i = event.resultIndex; i < event.results.length; ++i) {
        if (event.results[i].isFinal) {
          finalTranscript += (finalTranscript ? ' ' : '') + event.results[i][0].transcript.trim();
        } else {
          interim += event.results[i][0].transcript;
        }
      }
      const rawRes = finalTranscript + (interim ? ' ' + interim : '');
      const input = document.getElementById('answerInput');
      input.value = capitalizeFirst(rawRes);
    };

    recognition.onerror = (e) => {
      if (e.error !== 'no-speech') {
        stopMicrophone();
      }
    };

    recognition.onend = () => {
      if (isListening && !manualStop) {
        try {
          recognition.start();
        } catch(err) {
          stopMicrophone();
        }
      } else {
        stopMicrophone();
      }
    };

    recognition.start();
  }

  loadLessonFile();
</script>
</body>
</html>
