 <!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>English Master Trainer</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg: #0b1e28;
      --card-bg: #133340;
      --card-border: #1d4657;
      --accent-mango: #f97316;
      --accent-mango-hover: #ea580c;
      --teal-sound: #14b8a6;
      --success-teal: #2dd4bf;
      --coral-danger: #f87171;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 650px; display: flex; flex-direction: column; gap: 16px; }

    .header-card {
      background: linear-gradient(135deg, #133340 0%, #0d2734 100%);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .score-title { font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
    .score-val { font-size: 34px; font-weight: 700; color: var(--accent-mango); }
    .score-val.minus { color: var(--coral-danger); }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .task-box {
      background: #0b1e28;
      border: 1px solid var(--card-border);
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      font-size: 20px;
      font-weight: 600;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.4;
    }

    .input-row { display: flex; gap: 10px; align-items: center; }
    input {
      flex: 1;
      background: #08161f;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
    }
    input:focus { outline: 1px solid var(--accent-mango); }

    .btn-mango {
      background: var(--accent-mango);
      color: #fff;
      font-weight: 600;
      border: none;
      padding: 14px 22px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.2s;
    }
    .btn-mango:hover { background: var(--accent-mango-hover); }
    .btn-mango:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-mic {
      background: #08161f;
      border: 1px solid var(--card-border);
      color: var(--teal-sound);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-mic.listening { background: var(--coral-danger); color: #fff; animation: pulse 1s infinite; }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .feedback {
      padding: 14px;
      border-radius: 8px;
      font-size: 15px;
      text-align: center;
      display: none;
      line-height: 1.4;
    }
    .feedback.correct {
      display: block;
      background: rgba(45, 212, 191, 0.15);
      color: var(--success-teal);
      border: 1px solid var(--success-teal);
    }
