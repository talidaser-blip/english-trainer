<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>English Master Trainer</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg: #0b1e28;
      --card-bg: #133340;
      --card-border: #1d4657;
      --accent-mango: #f97316;
      --accent-mango-hover: #ea580c;
      --teal-sound: #14b8a6;
      --success-teal: #2dd4bf;
      --coral-danger: #f87171;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 650px; display: flex; flex-direction: column; gap: 16px; }

    .header-card {
      background: linear-gradient(135deg, #133340 0%, #0d2734 100%);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .score-title { font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
    .score-val { font-size: 34px; font-weight: 700; color: var(--accent-mango); }
    .score-val.minus { color: var(--coral-danger); }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .task-box {
      background: #0b1e28;
      border: 1px solid var(--card-border);
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      font-size: 20px;
      font-weight: 600;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.4;
    }

    .input-row { display: flex; gap: 10px; align-items: center; }
    input {
      flex: 1;
      background: #08161f;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
    }
    input:focus { outline: 1px solid var(--accent-mango); }

    .btn-mango {
      background: var(--accent-mango);
      color: #fff;
      font-weight: 600;
      border: none;
      padding: 14px 22px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.2s;
    }
    .btn-mango:hover { background: var(--accent-mango-hover); }

    .btn-mic {
      background: #08161f;
      border: 1px solid var(--card-border);
      color: var(--teal-sound);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-mic.listening { background: var(--coral-danger); color: #fff; animation: pulse 1s infinite; }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .feedback {
      padding: 14px;
      border-radius: 8px;
      font-size: 15px;
      text-align: center;
      display: none;
      line-height: 1.4;
    }
    .feedback.correct {
      display: block;
      background: rgba(45, 212, 191, 0.15);
      color: var(--success-teal);
      border: 1px solid var(--success-teal);
    }
    .feedback.wrong {
      display: block;
      background: rgba(248, 113, 113, 0.15);
      color: var(--coral-danger);
      border: 1px solid var(--coral-danger);
    }

    .status-tag {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      background: #0b1e28;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
    }

    .sub-badge {
      font-size: 11px;
      color: var(--teal-sound);
      margin-top: 4px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-card">
    <div>
      <div class="score-title">Баланс урока</div>
      <div class="score-val" id="scoreDisplay">0 ₽</div>
    </div>
    <div style="text-align: right;">
      <span class="status-tag" id="blockBadge">Блок 1: RU ➔ EN</span>
      <div class="sub-badge" id="subBadge">Подблок 1</div>
      <div style="font-size: 13px; color: var(--text-muted); margin-top: 4px;" id="stepCounter">...</div>
    </div>
  </div>

  <div class="panel">
    <div class="task-box" id="taskQuestion">Загрузка данных...</div>

    <div class="input-row">
      <input type="text" id="answerInput" placeholder="Введите перевод на английском..." autocomplete="off">
      <button class="btn-mic" id="micBtn" type="button" onclick="toggleSpeechRecognition()" title="Голосовой ввод">🎙️</button>
      <button class="btn-mango" type="button" onclick="checkUserAnswer()">OK</button>
    </div>

    <div class="feedback" id="feedbackMsg"></div>
  </div>
</div>

<script>
  let lessonTasks = [];
  let currentIndex = 0;
  let currentPhrase = null;
  let balance = 0;
  let recognition = null;
  let isListening = false;

  function updateBalance(points) {
    balance += points;
    const el = document.getElementById('scoreDisplay');
    el.innerText = `${balance} ₽`;
    if (balance < 0) el.classList.add('minus');
    else el.classList.remove('minus');
  }

  function cleanStr(text) {
    return (text || '').toLowerCase().replace(/[.,/#!$%^&*;:{}=\-_`~()?'"]/g, '').replace(/\s+/g, ' ').trim();
  }

  // Загрузчик с перебором относительных и прямых путей
  async function loadLessonFile() {
    const paths = [
      'lessons/lesson_1.txt',
      './lessons/lesson_1.txt',
      '/english-trainer/lessons/lesson_1.txt'
    ];

    let textData = null;
    for (const p of paths) {
      try {
        const res = await fetch(p);
        if (res.ok) {
          textData = await res.text();
          break;
        }
      } catch (err) {}
    }

    if (textData) {
      parseLessonText(textData);
    } else {
      document.getElementById('taskQuestion').innerText = 'Не удалось загрузить lessons/lesson_1.txt. Проверьте наличие файла в репозитории.';
    }
  }

  function parseLessonText(rawText) {
    const lines = rawText.split('\n').map(l => l.trim());
    let inBlock1 = false;
    let currentSub = 'Подблок 1';
    lessonTasks = [];

    for (const line of lines) {
      if (line.startsWith('# БЛОК 1')) {
        inBlock1 = true;
        continue;
      }
      if (line.startsWith('# БЛОК 2')) {
        break;
      }
      if (inBlock1) {
        if (line.startsWith('## ПОДБЛОК')) {
          currentSub = line.replace('##', '').trim();
          continue;
        }
        if (line.includes('|') && !line.startsWith('#')) {
          const parts = line.split('|').map(p => p.trim());
          if (parts.length >= 2) {
            lessonTasks.push({
              ru: parts[0],
              en: parts[1],
              sub: currentSub
            });
          }
        }
      }
    }

    if (lessonTasks.length > 0) {
      currentIndex = 0;
      showNextTask();
    } else {
      document.getElementById('taskQuestion').innerText = 'В Блоке 1 не найдены предложения. Проверьте разделитель | в файле.';
    }
  }

  function showNextTask() {
    if (currentIndex >= lessonTasks.length) {
      document.getElementById('taskQuestion').innerText = '🎉 Блок 1 полностью пройден!';
      document.getElementById('stepCounter').innerText = `${lessonTasks.length} из ${lessonTasks.length}`;
      confetti({ particleCount: 120, spread: 70, origin: { y: 0.6 } });
      return;
    }

    currentPhrase = lessonTasks[currentIndex];
    document.getElementById('taskQuestion').innerText = currentPhrase.ru;
    document.getElementById('subBadge').innerText = currentPhrase.sub;
    document.getElementById('stepCounter').innerText = `${currentIndex + 1} из ${lessonTasks.length}`;

    const input = document.getElementById('answerInput');
    input.value = '';
    input.focus();

    const fb = document.getElementById('feedbackMsg');
    fb.style.display = 'none';
  }

  function checkUserAnswer() {
    const input = document.getElementById('answerInput');
    const userVal = cleanStr(input.value);
    const targetVal = cleanStr(currentPhrase.en);
    const fb = document.getElementById('feedbackMsg');

    if (!userVal) return;

    if (userVal === targetVal) {
      updateBalance(+5);
      fb.className = 'feedback correct';
      fb.innerHTML = `✓ Верно! <strong>+5 ₽</strong>`;
      speakText(currentPhrase.en, 1);
      setTimeout(() => {
        currentIndex++;
        showNextTask();
      }, 1000);
    } else {
      updateBalance(-5);
      fb.className = 'feedback wrong';
      fb.innerHTML = `✕ Ошибка (<strong>-5 ₽</strong>)<br>Правильно: <strong>${currentPhrase.en}</strong>`;
      speakText(currentPhrase.en, 0.8);
    }
  }

  document.getElementById('answerInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') checkUserAnswer();
  });

  function speakText(text, rate = 1) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    setTimeout(() => {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = rate;
      window.speechSynthesis.speak(u);
    }, 40);
  }

  function toggleSpeechRecognition() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      alert('Голосовой ввод не поддерживается данным браузером.');
      return;
    }

    const micBtn = document.getElementById('micBtn');

    if (isListening && recognition) {
      recognition.stop();
      return;
    }

    recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = false;

    recognition.onstart = () => {
      isListening = true;
      micBtn.classList.add('listening');
    };

    recognition.onresult = (event) => {
      const spokenText = event.results[0][0].transcript;
      document.getElementById('answerInput').value = spokenText;
      checkUserAnswer();
    };

    recognition.onend = () => {
      isListening = false;
      micBtn.classList.remove('listening');
    };

    recognition.start();
  }

  loadLessonFile();
</script>
</body>
</html>
